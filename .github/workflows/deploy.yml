name: Deploy to GitHub Pages

on:
    push:
        branches: [master]
    workflow_dispatch:

concurrency:
    group: github-pages
    cancel-in-progress: true

# Allow this job to clone the repo and create a page deployment
permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout your repository using git
              uses: actions/checkout@v4
            - name: Configure GitHub Pages
              uses: actions/configure-pages@v5
            - name: Download Swiss vector basemap
              run: |
                  curl --fail --location --retry 3 \
                    https://github.com/enwo02/Hide-and-Seek/releases/download/basemap-ch-20261110/switzerland-20261110.pmtiles \
                    --output public/switzerland-20261110.pmtiles
                  echo "80ad86ede1862647533ff8f85d5a37beec886935954341a697f5558003ace35f  public/switzerland-20261110.pmtiles" | sha256sum --check
            - name: Install, build, and upload your site
              uses: withastro/action@v3
              env:
                  PUBLIC_GAME_WORKER_URL: ${{ vars.PUBLIC_GAME_WORKER_URL }}
              with:
                  path: . # The root location of your Astro project inside the repository. (optional)
                  node-version: 24 # The specific version of Node that should be used to build your site. Defaults to 20. (optional)
                  package-manager: pnpm@latest # The Node package manager that should be used to install dependencies and build your site. Automatically detected based on your lockfile. (optional)

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
